<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro Exitoso</title>
</head>

<body style="
        margin:0;
        padding:0;
        background:#eef5ff;
        font-family:Arial,sans-serif;
">

<table width="100%" cellpadding="0" cellspacing="0">

  <tr>
    <td align="center">

      <table width="600"
             style="
                        background:white;
                        margin-top:40px;
                        border-radius:12px;
                        overflow:hidden;
                        box-shadow:0 4px 14px rgba(0,0,0,0.1);
                   ">

        <!-- HEADER -->
        <tr>
          <td align="center"
              style="
                            background:#1e88e5;
                            padding:30px;
                            color:white;
                        ">

            <h1 style="margin:0;">
              Registro Exitoso
            </h1>

          </td>
        </tr>

        <!-- CONTENT -->
        <tr>
          <td style="
                            padding:40px;
                            text-align:center;
                    ">

            <img
                    src="https://cdn-icons-png.flaticon.com/512/845/845646.png"
                    width="120"
            />

            <h2 style="
                                margin-top:25px;
                                color:#222;
                        ">
              Hola {{name}}
            </h2>

            <p style="
                                color:#555;
                                line-height:1.7;
                                font-size:16px;
                        ">

              Tu cuenta docente fue creada correctamente
              en la plataforma Saber 11.

            </p>

            <p style="
                                color:#555;
                                line-height:1.7;
                                font-size:16px;
                        ">

              Ya puedes ingresar para administrar
              simulacros, revisar reportes y visualizar
              resultados académicos.

            </p>

          </td>
        </tr>

        <!-- FOOTER -->
        <tr>
          <td align="center"
              style="
                                background:#fafafa;
                                padding:25px;
                                color:#999;
                                font-size:12px;
                        ">

            Plataforma Saber 11 © 2026

          </td>
        </tr>

      </table>

    </td>
  </tr>

</table>

</body>
</html>

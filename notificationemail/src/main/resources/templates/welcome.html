<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido Saber 11</title>
</head>

<body style="
        margin:0;
        padding:0;
        background-color:#eef4ff;
        font-family:Arial,sans-serif;
">

<table width="100%" cellpadding="0" cellspacing="0">

    <tr>
        <td align="center">

            <table width="600"
                   style="
                        background:white;
                        margin-top:40px;
                        border-radius:12px;
                        overflow:hidden;
                        box-shadow:0 4px 15px rgba(0,0,0,0.1);
                   ">

                <!-- HEADER -->
                <tr>
                    <td align="center"
                        style="
                            background:#0d47a1;
                            color:white;
                            padding:35px;
                        ">

                        <h1 style="margin:0;">
                            Plataforma Saber 11
                        </h1>

                        <p style="
                                margin-top:10px;
                                font-size:15px;
                        ">
                            Inicio de sesión exitoso
                        </p>

                    </td>
                </tr>

                <!-- ICON -->
                <tr>
                    <td align="center"
                        style="padding-top:35px;">

                        <img
                                src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                                width="120"
                        />

                    </td>
                </tr>

                <!-- CONTENT -->
                <tr>
                    <td style="
                            padding:20px 45px 45px 45px;
                            text-align:center;
                    ">

                        <h2 style="
                                color:#222;
                                margin-bottom:20px;
                        ">
                            Hola {{name}}
                        </h2>

                        <p style="
                                color:#555;
                                font-size:16px;
                                line-height:1.8;
                        ">

                            Tu acceso a la plataforma fue realizado
                            correctamente.

                        </p>

                        <p style="
                                color:#555;
                                font-size:16px;
                                line-height:1.8;
                        ">

                            Desde aquí podrás gestionar simulacros,
                            revisar reportes académicos y consultar
                            resultados generales.

                        </p>

                        <!-- BUTTON -->
                        <a href="{{platformLink}}"
                           style="
                                display:inline-block;
                                margin-top:30px;
                                background:#0d47a1;
                                color:white;
                                padding:15px 35px;
                                text-decoration:none;
                                border-radius:8px;
                                font-weight:bold;
                           ">

                            Ir a la Plataforma

                        </a>

                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td align="center"
                        style="
                            background:#fafafa;
                            padding:25px;
                            color:#999;
                            font-size:12px;
                        ">

                        Plataforma Saber 11 © 2026

                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>

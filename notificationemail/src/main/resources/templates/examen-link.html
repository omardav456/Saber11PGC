<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Simulacro Disponible</title>
</head>

<body style="
        margin:0;
        padding:0;
        background:#f4f8ff;
        font-family:Arial,sans-serif;
">

<table width="100%" cellpadding="0" cellspacing="0">

    <tr>
        <td align="center">

            <table width="600"
                   style="
                        background:white;
                        margin-top:40px;
                        border-radius:12px;
                        overflow:hidden;
                        box-shadow:0 4px 15px rgba(0,0,0,0.1);
                   ">

                <!-- HEADER -->
                <tr>
                    <td align="center"
                        style="
                            background:#3949ab;
                            color:white;
                            padding:30px;
                        ">

                        <h1 style="margin:0;">
                            Simulacro Disponible
                        </h1>

                    </td>
                </tr>

                <!-- CONTENT -->
                <tr>
                    <td style="
                            padding:40px;
                            text-align:center;
                    ">

                        <img
                                src="https://cdn-icons-png.flaticon.com/512/3135/3135789.png"
                                width="130"
                        />

                        <h2 style="
                                margin-top:20px;
                                color:#222;
                        ">
                            Hola {{name}}
                        </h2>

                        <p style="
                                color:#555;
                                line-height:1.7;
                                font-size:16px;
                        ">

                            Ya se encuentra habilitado un nuevo
                            simulacro en la plataforma Saber 11.

                        </p>

                        <p style="
                                color:#555;
                                line-height:1.7;
                                font-size:16px;
                        ">

                            Puedes ingresar desde el siguiente botón:

                        </p>

                        <a href="{{examLink}}"
                           style="
                                display:inline-block;
                                margin-top:25px;
                                background:#3949ab;
                                color:white;
                                padding:15px 35px;
                                text-decoration:none;
                                border-radius:8px;
                                font-weight:bold;
                           ">

                            Presentar Simulacro

                        </a>

                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td align="center"
                        style="
                            background:#fafafa;
                            padding:25px;
                            color:#999;
                            font-size:12px;
                        ">

                        Plataforma Saber 11 © 2026

                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
